
       name: Build VERIFIED Signed Lesvos Basket AAB v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          test -n "$ZIP" || { echo "ZIP NOT FOUND"; exit 1; }
          mkdir -p android-build
          unzip -q "$ZIP" -d android-build
          SETTINGS=$(find android-build -name settings.gradle.kts | head -1)
          test -n "$SETTINGS" || { echo "ANDROID PROJECT NOT FOUND"; exit 1; }

      - name: Set versionCode 2
        shell: bash
        run: |
          GRADLE=$(find android-build -path "*/app/build.gradle.kts" | head -1)
          test -n "$GRADLE" || { echo "app/build.gradle.kts NOT FOUND"; exit 1; }

          sed -i -E 's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 2/' "$GRADLE"

          echo "Checking versionCode..."
          grep "versionCode" "$GRADLE"
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*2' "$GRADLE" || {
            echo "VERSION CODE 2 NOT SET"
            exit 1
          }

      - name: Restore SAME upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "KEYSTORE_BASE64 SECRET MISSING"
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lesvos-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/lesvos-upload.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias lesvosupload > /dev/null
          echo "EXISTING UPLOAD KEY RESTORED"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release AAB versionCode 2
        shell: bash
        run: |
          PROJECT=$(dirname "$(find android-build -name settings.gradle.kts | head -1)")
          cd "$PROJECT"
          gradle bundleRelease --stacktrace

      - name: Sign AAB with SAME upload key
        shell: bash
        run: |
          AAB=$(find android-build -type f -name "*.aab" | head -1)
          test -n "$AAB" || { echo "AAB NOT FOUND"; exit 1; }

          jarsigner \
            -keystore "$RUNNER_TEMP/lesvos-upload.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            "$AAB" lesvosupload

      - name: VERIFY signature - FAIL if unsigned
        shell: bash
        run: |
          AAB=$(find android-build -type f -name "*.aab" | head -1)
          jarsigner -verify "$AAB" | grep -q "jar verified" || {
            echo "SIGNATURE VERIFICATION FAILED"
            exit 1
          }
          echo "SIGNED AAB VERIFIED"

      - name: Upload VERIFIED AAB v2
        uses: actions/upload-artifact@v4
        with:
          name: Lesvos-Basket-SIGNED-AAB-v2
          path: android-build/**/*.aab 
