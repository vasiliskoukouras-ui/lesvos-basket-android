name: Build VERIFIED Signed Lesvos Basket AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          test -n "$ZIP" || { echo "ZIP NOT FOUND"; exit 1; }
          mkdir android-build
          unzip -q "$ZIP" -d android-build
          find android-build -name settings.gradle.kts -print

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate upload keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/lesvos-upload.jks" \
            -storepass "LesvosBasket2026Secure" \
            -keypass "LesvosBasket2026Secure" \
            -alias lesvosupload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Lesvos Basket, O=Lesvos Basket, C=GR"

      - name: Build release AAB
        shell: bash
        run: |
          PROJECT=$(dirname "$(find android-build -name settings.gradle.kts | head -1)")
          cd "$PROJECT"
          gradle bundleRelease --stacktrace

      - name: Sign AAB
        shell: bash
        run: |
          AAB=$(find android-build -type f -name "*.aab" | head -1)
          test -n "$AAB" || { echo "AAB NOT FOUND"; exit 1; }

          jarsigner \
            -keystore "$RUNNER_TEMP/lesvos-upload.jks" \
            -storepass "LesvosBasket2026Secure" \
            -keypass "LesvosBasket2026Secure" \
            "$AAB" lesvosupload

      - name: VERIFY signature - FAIL if unsigned
        shell: bash
        run: |
          AAB=$(find android-build -type f -name "*.aab" | head -1)
          jarsigner -verify -verbose -certs "$AAB"
          jarsigner -verify "$AAB" | grep -q "jar verified" || {
            echo "SIGNATURE VERIFICATION FAILED"
            exit 1
          }
          echo "SIGNED AAB VERIFIED SUCCESSFULLY"

      - name: Upload SIGNED AAB
        uses: actions/upload-artifact@v4
        with:
          name: Lesvos-Basket-SIGNED-AAB
          path: android-build/**/*.aab

      - name: Save upload key
        uses: actions/upload-artifact@v4
        with:
          name: Lesvos-Basket-UPLOAD-KEY-KEEP-SAFE
          path: ${{ runner.temp }}/lesvos-upload.jks
