name: Build Lesvos Basket Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          echo "Using $ZIP_FILE"
          rm -rf android-build
          mkdir android-build
          unzip -q "$ZIP_FILE" -d android-build
          find android-build -maxdepth 3 -type f | head -50

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android App Bundle
        shell: bash
        run: |
          PROJECT=$(find android-build -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
          test -n "$PROJECT"
          echo "Android project: $PROJECT"
          cd "$PROJECT"
          gradle bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Lesvos-Basket-AAB
          path: android-build/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error
