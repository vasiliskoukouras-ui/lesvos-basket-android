name: Build Signed Lesvos Basket Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n1)
          test -n "$ZIP_FILE"
          rm -rf android-build
          mkdir android-build
          unzip -q "$ZIP_FILE" -d android-build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build AAB
        shell: bash
        run: |
          PROJECT=$(find android-build -type f -name "settings.gradle.kts" -print -quit)
          PROJECT=$(dirname "$PROJECT")
          cd "$PROJECT"
          gradle bundleRelease

      - name: Create upload key
        shell: bash
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore upload-keystore.jks \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias lesvosbasket \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Lesvos Basket, O=Lesvos Basket, C=GR"

      - name: Sign AAB
        shell: bash
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB=$(find android-build -type f -path "*/outputs/bundle/release/*.aab" -print -quit)
          test -n "$AAB"

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" lesvosbasket

          jarsigner -verify
