name: Build VERIFIED Signed Lesvos Basket AAB v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          test -n "$ZIP" || { echo "ZIP NOT FOUND"; exit 1; }
          mkdir -p android-build
          unzip -q "$ZIP" -d android-build
          SETTINGS=$(find android-build -name settings.gradle.kts | head -1)
          test -n "$SETTINGS" || { echo "ANDROID PROJECT NOT FOUND"; exit 1; }

      - name: Set versionCode 4
        shell: bash
        run: |
          GRADLE=$(find android-build -path "*/app/build.gradle.kts" | head -1)
          test -n "$GRADLE" || { echo "app/build.gradle.kts NOT FOUND"; exit 1; }
          sed -i -E 's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 4/' "$GRADLE"
          grep "versionCode" "$GRADLE"
                  sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' "$GRADLE"
        sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 36/' "$GRADLE"

      - name: Restore upload key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 SECRET MISSING"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD SECRET MISSING"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lesvos-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/lesvos-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias lesvosupload > /dev/null
          echo "UPLOAD KEY RESTORED"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release AAB
        shell: bash
        run: |
          SETTINGS=$(find android-build -name settings.gradle.kts | head -1)
          PROJECT=$(dirname "$SETTINGS")
          cd "$PROJECT"
          gradle bundleRelease --stacktrace

      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          AAB=$(find android-build -type f -name "*.aab" | head -1)
          test -n "$AAB" || { echo "AAB NOT FOUND"; exit 1; }

          jarsigner \
            -keystore "$RUNNER_TEMP/lesvos-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            "$AAB" \
            lesvosupload

          jarsigner -verify -verbose -certs "$AAB"
          echo "SIGNED AAB VERIFIED"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Lesvos-Basket-SIGNED-AAB-v3
          path: android-build/**/*.aab
          if-no-files-found: error
